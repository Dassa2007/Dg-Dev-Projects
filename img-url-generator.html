<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image URL Generator - DG-DEV PROJECTS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* Animated Background */
.animated-bg {
  position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg);
}
.animated-bg .blob {
  position: absolute; filter: blur(80px); border-radius: 50%; opacity: 0.4; animation: float-blob 10s infinite ease-in-out alternate;
}
.blob-1 { width: 300px; height: 300px; background: #8b5cf6; top: -50px; left: -50px; }
.blob-2 { width: 400px; height: 400px; background: #3b82f6; bottom: -100px; right: -100px; animation-delay: -5s; }
@keyframes float-blob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

/* Page Specific */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.share-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 16px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Poppins', sans-serif; font-weight: 600; transition: all 0.3s; }
.share-btn:hover { background: rgba(139, 92, 246, 0.2); color: #fff; border-color: var(--primary); }
.server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.server-card { padding: 16px; border: 2px solid rgba(255,255,255,0.05); border-radius: 14px; cursor: pointer; background: rgba(0,0,0,0.2); transition: all 0.3s; text-align: center; position: relative; overflow: hidden; }
.server-card:hover { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.05); }
.server-card.active { border-color: var(--primary); background: rgba(139, 92, 246, 0.15); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
.server-card .icon { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; display: block; }
.server-card .title { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.95rem; color: #fff; }
.server-card.active .icon { color: #fff; }
.upload-zone { border: 2px dashed rgba(255,255,255,0.2); border-radius: 14px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(0,0,0,0.2); }
.upload-zone:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }
.upload-zone input { display: none; }
.upload-zone i { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; }
.upload-zone p { font-size: 0.9rem; color: var(--text-muted); }
.result-box { display: none; margin-top: 24px; padding: 20px; border-radius: 14px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); }
.result-box.visible { display: block; animation: slideUp 0.4s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.result-title { font-family: 'Poppins', sans-serif; font-weight: 600; color: #22c55e; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.url-input-group { display: flex; gap: 8px; margin-bottom: 10px; }
.url-input-group input { flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: monospace; font-size: 0.9rem; }
.copy-btn { padding: 12px 20px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600; transition: all 0.2s; }
.copy-btn:hover { background: #a855f7; }
/* Loading Spinner */
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.watermark { text-align: center; margin-top: 60px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: 4px; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0.2; pointer-events: none; }
</style>
</head>
<body>
<div class="animated-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<main class="page-container">
  <div class="top-bar">
    <div>
      <h1 class="page-title">Image URL Generator 🖼️</h1>
      <p class="page-subtitle">Upload an image and get a direct shareable link.</p>
    </div>
    <button class="share-btn" onclick="sharePage()"><i class="fa-solid fa-share-nodes"></i> Share</button>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Select Server:</label>
      <div class="server-grid" id="serverGrid">
        <div class="server-card active" data-server="server1"><span class="icon"><i class="fa-solid fa-server"></i></span><div class="title">Server 1</div></div>
        <div class="server-card" data-server="server2"><span class="icon"><i class="fa-solid fa-database"></i></span><div class="title">Server 2</div></div>
        <div class="server-card" data-server="server3"><span class="icon"><i class="fa-solid fa-cloud"></i></span><div class="title">Server 3</div></div>
        <div class="server-card" data-server="server4"><span class="icon"><i class="fa-solid fa-rocket"></i></span><div class="title">Server 4</div></div>
      </div>
      <input type="hidden" id="serverSelect" value="server1">
    </div>

    <div class="form-group">
      <label class="form-label">Select Image File:</label>
      <label class="upload-zone" for="fileInput">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p id="fileName">Click to browse or drag image here</p>
        <input type="file" id="fileInput" accept="image/*">
      </label>
    </div>
    
    <button class="btn-primary" id="uploadBtn" style="width:100%;" onclick="uploadFile()"><i class="fa-solid fa-link"></i> Generate Link</button>

    <div class="result-box" id="resultArea"></div>
  </div>

  <div class="watermark">DG-DEV</div>
</main>

<script src="main.js"></script>
<script>
  const servers = {
    server1: { cloudName: "wwb8ifud", uploadPreset: "dg_dev" },
    server2: { cloudName: "rakvvolf", uploadPreset: "dg_dev1" },
    server3: { cloudName: "v2dlq2nx", uploadPreset: "dg_dev2" },
    server4: { cloudName: "dxctmzctl", uploadPreset: "Dg_project" }
  };

  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  fileInput.addEventListener('change', (e) => {
    if(e.target.files.length > 0) {
      fileName.innerHTML = `<strong style="color:var(--primary)">${e.target.files[0].name}</strong> selected`;
    }
  });

  document.querySelectorAll('.server-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.server-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      document.getElementById('serverSelect').value = card.dataset.server;
    });
  });

  async function uploadFile() {
    const serverKey = document.getElementById('serverSelect').value;
    const resultArea = document.getElementById('resultArea');
    const uploadBtn = document.getElementById('uploadBtn');

    if (fileInput.files.length === 0) {
      window.dgdevToast('Please select an image first!', 'error');
      return;
    }

    const currentServer = servers[serverKey];
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', currentServer.uploadPreset);

    uploadBtn.disabled = true;
    resultArea.className = 'result-box visible';
    resultArea.innerHTML = '<div style="color:#fff; text-align:center;"><span class="spinner"></span> Uploading... Please wait.</div>';

    try {
      const response = await fetch(`https://api.cloudinary.com/v1_1/${currentServer.cloudName}/auto/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await response.json();

      if (data.secure_url) {
        const longUrl = data.secure_url;
        resultArea.innerHTML = `
          <div class="result-title"><i class="fa-solid fa-circle-check"></i> Upload Successful!</div>
          <div class="url-input-group">
            <input type="text" value="${longUrl}" id="urlInput" readonly>
            <button class="copy-btn" onclick="copyLink()"><i class="fa-regular fa-copy"></i> Copy</button>
          </div>
        `;
        window.dgdevToast('Link generated successfully!');
      } else {
        resultArea.className = 'result-box visible'; // keep visible but show error
        resultArea.innerHTML = `<div style="color:#ef4444;text-align:center;"><i class="fa-solid fa-circle-xmark"></i> Error: ${data.error?.message || 'Upload failed.'}</div>`;
      }
    } catch (error) {
      resultArea.innerHTML = `<div style="color:#ef4444;text-align:center;"><i class="fa-solid fa-circle-xmark"></i> Network error. Please try again.</div>`;
    } finally {
      uploadBtn.disabled = false;
    }
  }

  function copyLink() {
    const urlInput = document.getElementById('urlInput');
    urlInput.select();
    urlInput.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(urlInput.value);
    window.dgdevToast('Link copied to clipboard!');
  }

  function sharePage() {
    navigator.clipboard.writeText(window.location.href);
    window.dgdevToast('Page link copied!');
  }
</script>
</body>
</html>
