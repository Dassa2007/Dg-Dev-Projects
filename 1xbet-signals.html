<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1x Bet Signals - DG-DEV PROJECTS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){const t=localStorage.getItem('dgdev-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
.warning-box{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.1));border:1px solid var(--warning);border-radius:var(--radius);padding:16px;margin-bottom:24px}
.warning-box strong{color:var(--warning)}
.game-select-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px}
.game-select-box h3{margin-bottom:12px;font-size:1rem}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.game-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 8px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;font-size:.78rem;text-align:center;font-weight:600}
.game-item:hover{border-color:var(--primary);transform:translateY(-2px)}
.game-item.active{background:var(--accent-grad);color:#fff;border-color:transparent}
.game-item .game-icon{font-size:1.6rem}
.signals-wrap{margin-top:24px}
.signals-header h2{font-size:1.3rem;font-weight:700;margin-bottom:16px}
.signals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.signal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;animation:signalIn .5s ease both}
@keyframes signalIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.signal-card::after{content:'DG-DEV';position:absolute;bottom:8px;right:10px;font-size:.65rem;font-weight:800;letter-spacing:1px;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.7}
.signal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--text-muted);font-weight:600}
.signal-prediction{font-size:1.4rem;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.signal-meta{display:flex;gap:14px;font-size:.8rem;margin-top:10px}
.signal-ping{display:inline-flex;align-items:center;gap:4px}
.ping-dot{width:8px;height:8px;border-radius:50%}
.ping-green{background:var(--success)}.ping-yellow{background:var(--warning)}.ping-red{background:var(--danger)}
.confidence-bar{height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}
.confidence-fill{height:100%;background:var(--accent-grad);border-radius:3px}
.skeleton{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;height:150px;position:relative;overflow:hidden}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%);animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
</style>
</head>
<body>
<main class="page-container">
  <h1 class="page-title">1x Bet Signals 🎯</h1>
  <p class="page-subtitle">Free signals for 25+ popular games. Real-time simulation.</p>
  <div class="warning-box"><strong>⚠️ Disclaimer:</strong> These signals are <strong>NOT 100% guaranteed</strong>. Use at your own risk. Only play if you're comfortable with gambling. DG-DEV is not responsible for any losses.</div>
  <div class="game-select-box"><h3>🎮 Select a Game</h3><div class="games-grid" id="gamesGrid"></div></div>
  <div class="signals-wrap">
    <div class="signals-header"><h2 id="signalsTitle">Select a game to load signals</h2></div>
    <div class="signals-grid" id="signalsGrid"></div>
  </div>
</main>
<script src="main.js"></script>
<script>
(function(){
  const GAMES=[
    {id:'aviator',name:'Aviator',icon:'✈️',preds:['1.5x - 2.0x','1.8x','2.5x','1.3x','3.0x','2.2x']},
    {id:'jetx',name:'JetX',icon:'🛩️',preds:['1.6x - 2.2x','2.0x','1.4x','2.8x','3.2x']},
    {id:'luckyjet',name:'Lucky Jet',icon:'🚀',preds:['1.7x','2.1x','1.5x','2.5x','3.0x']},
    {id:'mines',name:'Mines',icon:'💎',preds:['Safe: 3 mines','Safe: 5 mines','Safe: 2 mines','Safe: 4 mines']},
    {id:'crash',name:'Crash',icon:'💥',preds:['1.5x','2.0x','2.5x','1.8x','3.0x']},
    {id:'plinko',name:'Plinko',icon:'🎯',preds:['Low risk','Medium risk','High risk','Low risk']},
    {id:'dice',name:'Dice',icon:'🎲',preds:['Over 50','Under 50','Exact 25','Over 45','Under 55']},
    {id:'hilo',name:'Hi-Lo',icon:'🎴',preds:['Hi','Lo','Hi','Lo','Hi']},
    {id:'keno',name:'Keno',icon:'🔢',preds:['7,12,23,45','5,18,33,50','11,22,36,48']},
    {id:'andarbahar',name:'Andar Bahar',icon:'🃏',preds:['Andar','Bahar','Andar','Bahar','Andar']},
    {id:'roulette',name:'Roulette',icon:'🎡',preds:['Red','Black','Red','Green','Black']},
    {id:'blackjack',name:'Blackjack',icon:'♠️',preds:['Hit','Stand','Double','Hit','Stand']},
    {id:'baccarat',name:'Baccarat',icon:'♦️',preds:['Player','Banker','Tie','Player','Banker']},
    {id:'dragontiger',name:'Dragon Tiger',icon:'🐲',preds:['Dragon','Tiger','Dragon','Tiger','Dragon']},
    {id:'teenpatti',name:'Teen Patti',icon:'🎴',preds:['Player A','Player B','Player C','Player A']},
    {id:'7updown',name:'7 Up Down',icon:'⬆️',preds:['7 Up','7 Down','7 Up','7 Down','7 Up']},
    {id:'sicbo',name:'Sic Bo',icon:'🎲',preds:['Big','Small','Big','Small','Any Triple']},
    {id:'penalty',name:'Penalty Kick',icon:'⚽',preds:['Left','Center','Right','Left','Right']},
    {id:'shootout',name:'Penalty Shootout',icon:'🥅',preds:['Goal','Miss','Goal','Save','Goal']},
    {id:'rocket',name:'Rocket',icon:'🚀',preds:['1.8x','2.4x','1.5x','2.0x','3.1x']},
    {id:'rollercoaster',name:'Rollercoaster',icon:'🎢',preds:['1.6x','2.2x','1.9x','2.7x']},
    {id:'spaceman',name:'Spaceman',icon:'👨‍🚀',preds:['1.7x','2.5x','2.0x','1.4x']},
    {id:'goal',name:'Goal',icon:'⚽',preds:['Goal','No Goal','Goal','Goal','No Goal']},
    {id:'tower',name:'Tower',icon:'🗼',preds:['Easy','Medium','Hard','Easy','Medium']},
    {id:'double',name:'Double Exposure',icon:'🎴',preds:['Player','Banker','Player','Tie','Banker']}
  ];
  const grid=document.getElementById('gamesGrid'),signalsGrid=document.getElementById('signalsGrid'),title=document.getElementById('signalsTitle');
  grid.innerHTML=GAMES.map(g=>`<div class="game-item" data-id="${g.id}"><span class="game-icon">${g.icon}</span><span>${g.name}</span></div>`).join('');
  grid.querySelectorAll('.game-item').forEach(el=>el.onclick=()=>{
    grid.querySelectorAll('.game-item').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    loadSignals(GAMES.find(g=>g.id===el.dataset.id));
  });
  function loadSignals(game){
    title.textContent=`${game.icon} ${game.name} - Live Signals`;
    signalsGrid.innerHTML=Array(5).fill('<div class="skeleton"></div>').join('');
    setTimeout(()=>{
      const now=Date.now(),signals=[];
      for(let i=0;i<5;i++){
        const t=new Date(now-i*60000),timeStr=t.toLocaleTimeString('en-US',{hour12:false});
        const ping=Math.floor(Math.random()*80)+20,confidence=Math.floor(Math.random()*12)+88;
        const period=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}${String(Math.floor(Math.random()*9999)).padStart(4,'0')}`;
        signals.push({period,timeStr,ping,confidence,prediction:game.preds[Math.floor(Math.random()*game.preds.length)]});
      }
      signalsGrid.innerHTML=signals.map((s,i)=>{
        const pingClass=s.ping<50?'ping-green':s.ping<100?'ping-yellow':'ping-red';
        return `<div class="signal-card" style="animation-delay:${i*0.05}s"><div class="signal-head"><span>#${s.period}</span><span>🕒 ${s.timeStr}</span></div><div class="signal-prediction">${s.prediction}</div><div class="signal-meta"><span class="signal-ping"><span class="ping-dot ${pingClass}"></span> Ping ${s.ping}ms</span><span>Confidence ${s.confidence}%</span></div><div class="confidence-bar"><div class="confidence-fill" style="width:${s.confidence}%"></div></div></div>`;
      }).join('');
    },700);
  }
})();
</script>
</body>
</html>
